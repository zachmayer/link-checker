name: ci

# One check job: zizmor finds no workflow security flaws, both lockfiles still
# install, linkinator still finds a broken link, the Python scripts still read
# its CSV, and ruff and ty pass. Dependabot's PRs merge once it passes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # https://docs.zizmor.sh
      # Audits every workflow in the repo and dependabot.yml for security
      # flaws. The action pins zizmor itself, so new rules arrive only with a
      # Dependabot bump, which merges only once they pass.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          min-severity: medium
          advanced-security: false
          annotations: true
      # Node 26 is the current LTS line; linkinator 8 needs Node 22 or newer.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm ci
      # A local site, so the check needs no network. The quoted pattern goes
      # through linkinator's own glob expansion, the code path the glob
      # override touches. The run must fail on the one broken link and report it.
      - name: linkinator finds the broken link
        run: |
          mkdir smoke
          echo '<a href="ok.html">ok</a>' > smoke/index.html
          echo '<p>ok</p>' > smoke/ok.html
          echo '<a href="missing.html">missing</a>' > smoke/broken.html
          if node_modules/.bin/linkinator "smoke/*.html" --format=csv --verbosity=error > smoke/links.csv; then
            echo "linkinator passed a site with a broken link"
            exit 1
          fi
          cat smoke/links.csv
          grep -q '^smoke/missing.html,404,BROKEN,smoke/broken.html' smoke/links.csv
      - uses: astral-sh/setup-uv@v10.3.3
      # uv installs the Python that .python-version names.
      - run: uv sync --locked
      # The same chain as the Makefile; the aggregate must count the one
      # broken link against the page that holds it.
      - name: the scripts read linkinator's CSV
        run: |
          uv run python scripts/filter_links.py smoke/links.csv smoke/filtered_links.csv
          uv run python scripts/aggregate_links.py smoke/filtered_links.csv smoke/aggregated_links.csv
          uv run python scripts/format_for_github.py smoke/filtered_links.csv smoke/filtered_links.md
          uv run python scripts/format_for_github.py smoke/aggregated_links.csv smoke/aggregated_links.md
          cat smoke/filtered_links.md smoke/aggregated_links.md
          grep -qx 'smoke/broken.html,1' smoke/aggregated_links.csv
      - run: make lint

  # Dependabot's PRs merge themselves. This job checks nothing out, so the PR's
  # code never runs with this write token, and --match-head-commit refuses a
  # head that moved after this run saw it.
  merge-dependabot:
    needs: [check]
    # Only someone with write access can push to Dependabot's branch, and they
    # can push to main anyway. Accepted: reopening a closed Dependabot PR, which
    # Triage allows, gets it merged once the checks pass.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
