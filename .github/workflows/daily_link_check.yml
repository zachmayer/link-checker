name: Daily Link Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '16'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          npm install
          pip install poetry
          poetry install

      - name: Run Link Checker
        run: |
          make run-link-check
          make filter-links
          make aggregate-links
          make generate-reports

      - name: Upload Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Reports
          path: reports/

      - name: Display Filtered Links Report
        run: |
          cat reports/filtered_links.md

      - name: Display Aggregated Links Report
        run: |
          cat reports/aggregated_links.md
