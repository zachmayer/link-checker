# Weekly version updates, grouped into one PR per ecosystem: package-lock.json,
# uv.lock, and the actions locked in actions.lock.
# Cooldown: a release waits 7 days before a version update proposes it, time
# for a compromised release to be caught and yanked. Security updates skip it.
# The merge-dependabot job in .github/workflows/ci.yml squash-merges each PR once its checks pass.
# package.json overrides glob to ^14.0.2 (GHSA-3g3m-2fjr-6pw4) because
# linkinator 8.1.0 still asks for glob ^13; drop the override once it allows 14.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Indirect dependencies too: by default version updates move only the
    # direct ones, so a package pulled in by another sits until a security alert.
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
