[project]
name = "internal-automations"
version = "0.1.0"
description = "Internal GitHub actions workflows for automation and reporting"
authors = [{ name = "Zach Deane-Mayer", email = "zach.mayer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.1.0",
    # pandas.DataFrame.to_markdown imports tabulate at call time.
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    # pandas annotates DataFrameGroupBy.size() as DataFrame | Series; the stubs
    # narrow it to Series, so ty accepts reset_index(name=...).
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "C901",
    "DTZ", "BLE", "S", "B", "PGH", "PTH", "RUF", "UP", "SIM", "RET", "ARG",
    "ANN", "FBT", "PL", "TRY", "PERF", "EXE", "ERA",
]
