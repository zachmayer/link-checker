[tool.poetry]
name = "internal-automations"
version = "0.1.0"
description = "Internal GitHub actions workflows for automation and reporting"
authors = ["Zach Deane-Mayer <zach.mayer@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = ">=2.2.3,<4.0.0"
ruff = ">=0.6.9,<0.18.0"
isort = ">=5.13.2,<10.0.0"
mypy = ">=1.11.2,<3.0.0"
pandas-stubs = ">=2.2.3.241009,<4.0.0.0"
click = "^8.1.7"
tabulate = ">=0.9,<0.11"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
